# Starts PostgreSQL and the API:  docker compose up -d
# Only the database (to run the API with ./gradlew bootRun):  docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: vshop-db
    environment:
      POSTGRES_DB: vshop
      POSTGRES_USER: vshop
      POSTGRES_PASSWORD: vshop
    ports:
      - "5433:5432"   # host 5433 so it doesn't clash with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vshop -d vshop"]
      interval: 2s
      retries: 30

  api:
    build: .
    container_name: vshop-api
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database is reached by its service name, not localhost:5433.
      DB_URL: jdbc:postgresql://postgres:5432/vshop
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
