# Starts PostgreSQL for local development:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: vshop-db
    environment:
      POSTGRES_DB: vshop
      POSTGRES_USER: vshop
      POSTGRES_PASSWORD: vshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
