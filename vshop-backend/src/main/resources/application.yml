spring:
  application:
    name: vshop-backend
  # Reads KEY=VALUE pairs from a .env file in the project folder (if it exists).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vshop}
    username: ${DB_USERNAME:vshop}
    password: ${DB_PASSWORD:vshop}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # Flyway owns the schema (see db/migration). Hibernate never changes tables.
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Email for password reset codes. Only used when OTP_LOG_ONLY=false.
  # For testing, a free Mailtrap sandbox inbox works: host sandbox.smtp.mailtrap.io, port 2525.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # don't mark the app DOWN when no mail server is running

app:
  jwt:
    # Must be at least 32 characters. Override with JWT_SECRET in .env.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-123456}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MIN:15}     # access JWT; the app refreshes on 401
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}     # refresh token (rotated on every /refresh)
  shop:
    delivery-fee: 1.50
    free-delivery-over: 20.00
  otp:
    # true = print reset codes in the server log (easy testing), false = send them by email
    log-only: ${OTP_LOG_ONLY:true}
    mail-from: ${MAIL_FROM:VShop <no-reply@vshop.local>}
    expiry-minutes: ${OTP_EXPIRY_MIN:10}
    max-verify-attempts: ${OTP_MAX_ATTEMPTS:5}                  # wrong codes before the code is locked
    max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:5}       # per email; more returns 429

payway:
  # true  = fake PayWay inside this app (no keys needed, approve payments with /api/dev/...)
  # false = real ABA PayWay sandbox (needs PAYWAY_API_KEY)
  mock: ${PAYWAY_MOCK:true}
  base-url: ${PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
  merchant-id: ${PAYWAY_MERCHANT_ID:}
  api-key: ${PAYWAY_API_KEY:}
  # Public URL PayWay calls when a payment finishes, e.g. https://abcd.ngrok-free.app/api/payway/callback
  callback-url: ${PAYWAY_CALLBACK_URL:}
  lifetime-minutes: ${PAYWAY_LIFETIME_MINUTES:15}
